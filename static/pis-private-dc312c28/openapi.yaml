      summary: Confidant patient login
      operationId: Confidant patient login
      description: |-
        This endpoint is used to create authorization token for confidant person to approve or reject scopes request for related person

        > **Note:** It could be done ONLY if there is a registered relation between actor (authenticated person) and related person

        This endpoint must be used only by Auth UI client.

        Look at [**Payload: Confidant patient login**](#tag/private-patient-information-system/POST/api/pis/confidant/login/decoded-payload) for more details.
      tags:
        - Private. Patient Information System
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              signed_content: 
              signed_content_encoding: base64
              client_id: 7673eb5a-0cae-4fa8-9f81-e6da46aa2941
              grant_type: pis-auth
              scope: app:authorize
            schema:
              type: object
              properties:
                signed_content:
                  type: string
                signed_content_encoding:
                  type: string
                client_id:
                  type: string
                grant_type:
                  type: string
                scope:
                  type: string
              required:
                - signed_content
                - signed_content_encoding
                - client_id
                - grant_type
                - scope
