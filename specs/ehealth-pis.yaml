                verification_status:
                  type: string
                  description: status of person DRACS death verification according to `PERSON_VERIFICATION_STATUSES` dictionary
                verification_reason:
                  type: string
                  description: how current DRACS death verification status has been set according to `PERSON_VERIFICATION_STATUS_REASONS` dictionary
                verification_comment:
                  type: string
                  description: DRACS death verification status description set by NHS or Doctor
