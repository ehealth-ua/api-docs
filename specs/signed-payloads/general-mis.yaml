              example: 0.25mg PO every 6-12 hours as needed for menses from Jan 15-20, 2015.  Do not exceed more than 4mg per day
            additional_instruction:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Codeable_Concept'
                  - type: object
                    properties:
                      coding:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Coding'
                            - type: object
                              properties:
                                system:
                                  type: string
                                  example: eHealth/SNOMED/additional_dosage_instructions
                                code:
                                  type: string
                                  example: "311504000"
                      text:
                        type: string
            patient_instruction:
              type: string
              description: Patient or consumer oriented instructions
              example: 0.25mg PO every 6-12 hours as needed for menses from Jan 15-20, 2015.  Do not exceed more than 4mg per day
            timing:
              $ref: '#/components/schemas/Timing'
          required:
            - sequence
            - text
          type: object
        - oneOf:
            - type: object
              title: as_needed_boolean
              required:
                - as_needed_boolean
              properties:
                as_needed_boolean:
                  type: boolean
                  example: true
            - type: object
              title: as_needed_codeable_concept
              required:
                - as_needed_codeable_concept
              properties:
                as_needed_codeable_concept:
                  type: object
                  required:
                    - coding
                  properties:
                    coding:
                      type: array
                      items:
                        type: object
                        properties:
                          system:
                            type: string
                            example: eHealth/SNOMED/medication_as_needed_reason_codes
                          code:
                            type: string
                            example: '144008'
                    text:
                      type: string
        - properties:
            site:
              allOf:
                - $ref: '#/components/schemas/Codeable_Concept'
                - type: object
                  required:
                    - coding
                  properties:
                    coding:
                      type: array
                      items:
                        allOf:
                          - $ref: '#/components/schemas/Coding'
                          - type: object
                            properties:
                              system:
                                type: string
                                example: eHealth/SNOMED/anatomical_structure_administration_site_codes
                              code:
                                type: string
                                example: "344001"
                    text:
                      type: string
              description: Body site to administer to
            route:
              allOf:
                - $ref: '#/components/schemas/Codeable_Concept'
                - type: object
                  required:
                    - coding
                  properties:
                    coding:
                      type: array
                      items:
                        allOf:
                          - $ref: '#/components/schemas/Coding'
                          - type: object
                            properties:
                              system:
                                type: string
                                example: eHealth/SNOMED/route_codes
                              code:
                                type: string
                                example: "46713006"
                    text:
                      type: string
              description: How drug should enter body
            method:
              allOf:
                - $ref: '#/components/schemas/Codeable_Concept'
                - type: object
                  required:
                    - coding
                  properties:
                    coding:
                      type: array
                      items:
                        allOf:
                          - $ref: '#/components/schemas/Coding'
                          - type: object
                            properties:
                              system:
                                type: string
                                example: eHealth/SNOMED/administration_methods
                              code:
                                type: string
                                example: "419747000"
                    text:
                      type: string
              description: Technique for administering medication
            dose_and_rate:
              $ref: '#/components/schemas/Dose_and_Rate'
            max_dose_per_period:
              $ref: '#/components/schemas/Ratio'
            max_dose_per_administration:
              $ref: '#/components/schemas/Simple_Quantity'
