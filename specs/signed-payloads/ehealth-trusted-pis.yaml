openapi: 3.1.0
info:
  title: eHealth Trusted PIS API — Signed Content (decoded payloads)
  version: 1.0.0
  description: |-
    Decoded `signed_data` payloads for signed endpoints. Each entry shows the structure to build, sign (КЕП / UA-EDS), and base64-encode. → [eHealth Trusted PIS API](reference.html)
tags:
  - name: Public. Patient Information System
paths:
  /api/pis/confidant/sign-in:
    post:
      tags:
        - Public. Patient Information System
      summary: 'Payload: Confidant patient sign-in'
      operationId: dummy-post-api-pis-confidant-sign-in
      description: |-
        This is Apiary's own **Dummy** test-method body for this operation (`POST /dummy/pis/confidant/sign-in`) -- a plain (unsigned), much smaller reference payload Apiary provides for MIS integration testing, distinct from the real signed `Person_Request_PIS` content (verified separately). → [Confidant patient sign-in](/?r#ehealth-trusted-pis/tag/public-patient-information-system/POST/api/pis/confidant/sign-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - last_name
                - given_name
              properties:
                last_name:
                  type: string
                  example: Петров
                given_name:
                  type: string
                  example: Петро Петрович
                tax_id:
                  type: string
                  example: '2323232323'
                document:
                  type: object
                  required:
                    - type
                    - number
                  properties:
                    type:
                      type: string
                      example: PASSPORT
                      description: '`Dictionary DOCUMENT_TYPE`'
                    number:
                      type: string
                      example: АА120518
                      description: document issue number
      responses:
        '200':
          description: Success
  /api/pis/sign-up:
    post:
      tags:
        - Public. Patient Information System
      summary: 'Payload: Patient sign-up'
      operationId: dummy-post-api-pis-sign-up
      description: |-
        This is Apiary's own **Dummy** test-method body for this operation (`POST /dummy/pis/sign-up`) -- a plain (unsigned) `person` body plus a `jwt`, used for MIS integration testing instead of the real signed `Person_Request_PIS` content (verified separately). → [Patient sign-up](/?r#ehealth-trusted-pis/tag/public-patient-information-system/POST/api/pis/sign-up)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - person
                - patient_signed
                - process_disclosure_data_consent
                - jwt
              properties:
                person:
                  $ref: '#/components/schemas/Person_Request_PIS'
                patient_signed:
                  type: boolean
                  example: true
                process_disclosure_data_consent:
                  type: boolean
                  example: true
                jwt:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6InNwLnZpcm55QGdtYWlsLmNvbSIsInRpbWVzdGFtcCI6IjIwMTgtMDItMjggMTA6Mzg6MDAifQ.LJRLTqK-zf9gxDNMONcI8cMCSYosDtmAIZqhzZUdhz4
            example:
              person:
                first_name: Петро
                last_name: Іванов
                second_name: Миколайович
                birth_date: '2009-07-05'
                birth_country: Україна
                birth_settlement: Вінниця
                gender: MALE
                email: email@example.com
                no_tax_id: false
                tax_id: '3999869394'
                secret: secret
                documents:
                  - type: PASSPORT
                    number: АА120518
                    issued_by: Рокитнянським РВ ГУ МВС Київської області
                    issued_at: '2017-02-28'
                    expiration_date: '2027-02-28'
                addresses:
                  - type: RESIDENCE
                    country: UA
                    area: Житомирська
                    region: Бердичівський
                    settlement: Київ
                    settlement_type: CITY
                    settlement_id: b075f148-7f93-4fc2-b2ec-2d81b19a9b7b
                    street_type: STREET
                    street: вул. Ніжинська
                    building: '15'
                    apartment: '23'
                    zip: '02090'
                phones:
                  - type: MOBILE
                    number: '+380503410870'
                authentication_methods:
                  - type: OTP
                    phone_number: '+380508887700'
                unzr: 20090705-00011
                emergency_contact:
                  first_name: Петро
                  last_name: Іванов
                  second_name: Миколайович
                  phones:
                    - type: MOBILE
                      number: '+380503410870'
                preferred_way_communication: email
              patient_signed: true
              process_disclosure_data_consent: true
              jwt: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6InNwLnZpcm55QGdtYWlsLmNvbSIsInRpbWVzdGFtcCI6IjIwMTgtMDItMjggMTA6Mzg6MDAifQ.LJRLTqK-zf9gxDNMONcI8cMCSYosDtmAIZqhzZUdhz4
      responses:
        '200':
          description: Success
  /api/pis/confidant/sign-up:
    post:
      tags:
        - Public. Patient Information System
      summary: 'Payload: Confidant patient sign-up'
      operationId: dummy-post-api-pis-confidant-sign-up
      description: |-
        This is Apiary's own **Dummy** test-method body for this operation (`POST /dummy/pis/confidant/sign-up`) -- a plain (unsigned) `person` body, used for MIS integration testing instead of the real signed `Person_Request_PIS_With_Confidant` content (verified separately). → [Confidant patient sign-up](/?r#ehealth-trusted-pis/tag/public-patient-information-system/POST/api/pis/confidant/sign-up)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - person
                - patient_signed
                - process_disclosure_data_consent
              properties:
                person:
                  $ref: '#/components/schemas/Person_Request_PIS_With_Confidant'
                patient_signed:
                  type: boolean
                  example: true
                process_disclosure_data_consent:
                  type: boolean
                  example: true
            example:
              person:
                first_name: Петро
                last_name: Іванов
                second_name: Миколайович
                birth_date: '2009-07-05'
                birth_country: Україна
                birth_settlement: Вінниця
                gender: MALE
                email: email@example.com
                no_tax_id: false
                tax_id: '3999869394'
                secret: secret
                documents:
                  - type: BIRTH_CERTIFICATE
                    number: АА120518
                    issued_by: Рокитнянським РВ ГУ МВС Київської області
                    issued_at: '2017-02-28'
                    expiration_date: '2027-02-28'
                addresses:
                  - type: RESIDENCE
                    country: UA
                    area: Житомирська
                    region: Бердичівський
                    settlement: Київ
                    settlement_type: CITY
                    settlement_id: b075f148-7f93-4fc2-b2ec-2d81b19a9b7b
                    street_type: STREET
                    street: вул. Ніжинська
                    building: '15'
                    apartment: '23'
                    zip: '02090'
                phones:
                  - type: MOBILE
                    number: '+380503410870'
                authentication_methods:
                  - type: THIRD_PERSON
                    value: c282f8a9-e709-40aa-94b4-dde1402bf4b6
                    alias: husband
                unzr: 20090705-00011
                emergency_contact:
                  first_name: Петро
                  last_name: Іванов
                  second_name: Миколайович
                  phones:
                    - type: MOBILE
                      number: '+380503410870'
                preferred_way_communication: email
                confidant_person:
                  person_id: b075f148-7f93-4fc2-b2ec-2d81b19a9b7b
                  relation_type: PRIMARY
                  documents_relationship:
                    - type: BIRTH_CERTIFICATE
                      number: АА120518
                      issued_by: Рокитнянським РВ ГУ МВС Київської області
                      issued_at: '2017-02-28'
              patient_signed: true
              process_disclosure_data_consent: true
      responses:
        '200':
          description: Success
components:
  schemas:
    Access_Token:
      type: object
      required:
        - value
        - user_id
        - name
        - expires_at
      properties:
        value:
          type: string
          description: oAuth access token.
        user_id:
          type: string
          description: User identifier
        name:
          type: string
          description: oAuth token name
        id:
          type: string
          description: oAuth token identifier
        expires_at:
          type: number
          description: expiration date-time timestamp
        details:
          type: object
          required:
            - scope
            - refresh_token
            - client_id
          properties:
            app_id:
              type: string
              description: Identifier of approval between user, applicant user and client that was used to issue access token
            applicant_user_id:
              type: string
              description: Identifier of user that initiated access token generation
            applicant_person_id:
              type: string
              description: Identifier of person that is accosiated with user who initiated access token generation
            scope:
              type: string
              description: List of scopes that is required in application business logic, separated by space
            refresh_token:
              type: string
              description: oAuth refresh token
            grant_type:
              type: string
            client_id:
              type: string
              description: Client ID of authorized user
    Access_Token_1:
      type: object
      required:
        - value
        - user_id
        - name
        - expires_at
      properties:
        value:
          type: string
          description: oAuth access token.
        user_id:
          type: string
          description: User identifier
        name:
          type: string
          description: oAuth token name
        id:
          type: string
          description: oAuth token identifier
        expires_at:
          type: number
          description: expiration date-time timestamp
        details:
          type: object
          required:
            - scope
            - client_id
          properties:
            app_id:
              type: string
              description: Identifier of approval between user, applicant user and client that was used to issue access token
            applicant_user_id:
              type: string
              description: Identifier of user that initiated access token generation
            applicant_person_id:
              type: string
              description: Identifier of person that is accosiated with user who initiated access token generation
            scope:
              type: string
              description: List of scopes that is required in application business logic, separated by space
            grant_type:
              type: string
            client_id:
              type: string
              description: Client ID of authorized user.
    Response_OK:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Response__Meta'
        data:
          type: object
          properties: {}
    Response__Meta:
      type: object
      properties:
        code:
          type: number
          description: HTTP response code.
        url:
          type: string
          description: URL to requested resource.
        type:
          type: string
          enum:
            - object
            - list
          description: Type of data that is located in `data` attribute.
        request_id:
          type: string
          description: '[Request ID](https://docs.apimanifest.apiary.io/#introduction/interacting-with-api/request-id). Send it with `X-Request-ID` header.'
    Response_Collection:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Response__Meta'
        data:
          type: array
          items:
            type: object
            properties: {}
        paging:
          $ref: '#/components/schemas/Response__Pagination'
    Response__Pagination:
      type: object
      properties:
        limit:
          type: number
          description: 'A limit on the number of objects to be returned, between 1 and 100. Default: 50.'
        cursors:
          type: object
          properties:
            starting_after:
              type: string
              description: A cursor for use in pagination. An object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with `obj_foo`, your subsequent call can include `starting_after=obj_foo` in order to fetch the next page of the list.
            ending_before:
              type: string
              description: A cursor for use in pagination. An object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, starting with `obj_bar`, your subsequent call can include `ending_before=obj_bar` in order to fetch the previous page of the list.
        size:
          type: number
          description: Total number of objects in collection.
        has_more:
          type: boolean
          description: Is this collection have more data to load in the same style as last request loaded it.
    media_content:
      type: object
      required:
        - type
        - url
      properties:
        type:
          type: string
        url:
          type: string
    Approval_Response:
      type: object
      required:
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Internal app ID, a UUID string.
        created_at:
          type: string
          description: ISO 8601 date and time in UTC timezone.
        updated_at:
          type: string
          description: ISO 8601 date and time in UTC timezone.
    Emergency_Contact:
      type: object
      required:
        - first_name
        - last_name
        - phones
      properties:
        first_name:
          type: string
        last_name:
          type: string
        second_name:
          type: string
        phones:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
    Phone:
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          description: '`Dictionary PHONE_TYPE` type of phone Land Line or Mobile. At least one of type must be present. Each type can be represented only once.'
        number:
          type: string
          description: phone number in format '+38/'
    Person:
      type: object
      required:
        - first_name
        - last_name
        - birth_date
        - birth_country
        - birth_settlement
        - gender
        - secret
        - documents
        - addresses
        - authentication_methods
      properties:
        first_name:
          type: string
        last_name:
          type: string
        second_name:
          type: string
        birth_date:
          type: string
        birth_country:
          type: string
        birth_settlement:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        email:
          type: string
        tax_id:
          type: string
        secret:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
        authentication_methods:
          type: array
          items:
            $ref: '#/components/schemas/Authentication_Method'
        preferred_way_communication:
          type: string
          enum:
            - email
            - phone
          description: the way how a patient wants to be reached
    Authentication_Method:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - OTP
            - OFFLINE
            - NA
        phone_number:
          type: string
          description: required for type = OTP
    Address:
      type: object
      required:
        - type
        - country
        - area
        - settlement
        - settlement_type
        - settlement_id
      properties:
        type:
          type: string
          description: '`Dictionary ADDRESS_TYPE`.'
        country:
          type: string
          enum:
            - UA
          description: '`Dictionary COUNTRY`'
        area:
          type: string
          description: one of Ukraianian area
        region:
          type: string
          description: district of area
        settlement:
          type: string
          description: city name
        settlement_type:
          type: string
          description: '`Dictionary SETTLEMENT_TYPE` - type of settlement as city/town/village etc'
        settlement_id:
          type: string
          description: settlement identificator from uaadresses
        street_type:
          type: string
          description: '`Dictionary STREET_TYPE` - type of street as street/road/line etc'
        street:
          type: string
          description: street name
        building:
          type: string
          description: number of building
        apartment:
          type: string
          description: number of appartment
        zip:
          type: string
          description: system of postal codes
    Document:
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          description: '`Dictionary DOCUMENT_TYPE`'
        number:
          type: string
          description: document issue number
        expiration_date:
          type: string
          description: '`document expiration date. Required for NATIONAL_ID document type`'
        issued_by:
          type: string
          description: authority which issued the document
        issued_at:
          type: string
          description: the date when document was issued
    Person_info_Public_PIS:
      type: object
      required:
        - first_name
        - last_name
        - birth_date
        - birth_country
        - birth_settlement
        - gender
        - no_tax_id
        - secret
        - documents
        - addresses
        - emergency_contact
        - confidant_person
      properties:
        first_name:
          type: string
        last_name:
          type: string
        second_name:
          type: string
        birth_date:
          type: string
        birth_country:
          type: string
        birth_settlement:
          type: string
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
        email:
          type: string
        no_tax_id:
          type: boolean
        tax_id:
          type: string
        secret:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
        authentication_methods:
          type: array
          items:
            $ref: '#/components/schemas/Authentication_Method'
        unzr:
          type: string
          description: the record number in the demographic register
        emergency_contact:
          type: object
          required:
            - first_name
            - last_name
            - phones
          properties:
            first_name:
              type: string
              example: Петро
            last_name:
              type: string
              example: Іванов
            second_name:
              type: string
              example: Миколайович
            phones:
              type: array
              items:
                $ref: '#/components/schemas/Phone'
        confidant_person:
