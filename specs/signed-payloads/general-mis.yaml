  /api/persons/{id}/verification:
    patch:
      tags:
        - Public. Medical Service Provider Integration Layer
      summary: 'Payload: Update Person verification status'
      operationId: dummy-patch-api-persons-id-verification
      description: Build, sign (КЕП / UA-EDS) and base64-encode **the structure below** into `signed_content`. → [Update Person verification status](/#general-mis/tag/public-medical-service-provider-integration-layer/PATCH//api/persons/{id}/verification)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: dracs_death
                  required:
                    - dracs_death
                  properties:
                    dracs_death:
                      type: object
                      required:
                        - verification_status
                        - verification_reason
                        - verification_comment
                      properties:
                        verification_status:
                          type: string
                          example: VERIFIED
                          description: Person DRACS death verification status according to `PERSON_VERIFICATION_STATUSES` dictionary. `VERIFIED` only is allowed.
                        verification_reason:
