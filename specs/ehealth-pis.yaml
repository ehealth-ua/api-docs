  /api/pis/apps:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/Response__Meta'
                    - type: object
                      properties:
                        code:
                          example: 200
                        url:
                          example: "https://example.com/resource"
                        type:
                          example: "object"
                        request_id:
                          example: "6617aeec-15e2-4d6f-b9bd-53559c358f97#17810"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          example: "1380df72-275a-11e7-93ae-92361f002671"
                          type: string
                          description: Internal app ID, a UUID string.
                        created_at:
                          example: "2017-04-20T19:14:13Z"
                          type: string
                          description: ISO 8601 date and time in UTC timezone.
                        updated_at:
                          example: "2017-04-20T19:14:13Z"
                          type: string
                          description: ISO 8601 date and time in UTC timezone.
                        user_id:
                          example: "1380df72-275a-11e7-93ae-92361f002671"
                          type: string
                          description: Internal user ID, a UUID string.
                        applicant_user_id:
                          example: "1380df72-275a-11e7-93ae-92361f002671"
                          type: string
                          description: Internal user ID, a UUID string.
                        client_name:
                          example: "Clinic N1"
                          type: string
                          description: Internal client name, string.
                        client_id:
                          example: "1380df72-275a-11e7-93ae-92361f002671"
                          type: string
                          description: Internal client ID, a UUID string.
                        scope:
                          example: "notebooks:read notebooks:create patients:read"
                          type: string
                          description: Scope, in a space-delimited format.
                      required:
                        - created_at
                        - updated_at
                        - user_id
                        - applicant_user_id
                        - client_name
                        - client_id
                        - scope
                  paging:
                    type: object
                    properties:
                      page_number:
                        example: 2
                        type: number
                        description: Page number.
                      page_size:
                        example: 50
                        type: number
                        description: 'A limit on the number of objects to be returned, between 1 and 300. Default: 50'
                      total_entries:
                        example: 1000
                        type: number
                        description: Total number of objects in collection.
                      total_pages:
                        example: 23
                        type: number
                        description: Total number of pages.
                    required:
                      - page_number
                      - page_size
                      - total_entries
                      - total_pages
                    additionalProperties: false
              example:
                meta:
                  code: 200
                  url: https://example.com/resource
                  type: object
                  request_id: 6617aeec-15e2-4d6f-b9bd-53559c358f97#17810
                data:
