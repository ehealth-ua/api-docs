    Medication_request_Public_Response_for_Pharmacist:
      type: object
      required:
        - id
        - status
        - created_at
        - started_at
        - ended_at
        - dispense_valid_from
        - dispense_valid_to
        - person
        - medication_info
        - medical_program
        - intent
        - category
        - context
        - dosage_instruction
      properties:
        id:
          type: string
          example: b075f148-7f93-4fc2-b2ec-2d81b19a9b7b
          description: Medication Request identifier
        status:
          type: string
          example: ACTIVE
          enum:
            - ACTIVE
            - COMPLETED
            - REJECTED
            - EXPIRED
          description: Medication Request status. Find available **statuses** on State Charts wiki page
        request_number:
          type: string
          example: 0000-243P-1X53-EH38
          description: Public medication request human readable number
        created_at:
          type: string
          example: '2017-08-17'
          description: Medication request creation date, which is determined by the external system. Format *DATE '2017-09-07'*
        started_at:
          type: string
          example: '2017-08-17'
          description: Start date of a treatment period, which is determined by the external system. Greater or equal to **created_at**. Format *DATE '2017-09-07'*
        ended_at:
          type: string
          example: '2017-09-16'
          description: End date of a treatment period, which is determined by the external system. Greater or equal to **started_at**. Format *DATE '2017-10-07'*
        dispense_valid_from:
          type: string
          example: '2017-08-17'
          description: Start date of dispense period, which is determined by the external system. Format *DATE '2017-09-07'*
        dispense_valid_to:
          type: string
          example: '2017-09-16'
          description: End date of dispense period, which is determined by the external system. Greater or equal to **dispense_valid_from**. Format *DATE '2017-10-07'*
        person:
          $ref: '#/components/schemas/Person_Medication_Request_for_Pharmacist'
        medication_info:
          $ref: '#/components/schemas/Innm_Dosage_for_Medication_request_Responce'
        medical_program:
          $ref: '#/components/schemas/Medical_Program_Response_without_settings'
        intent:
          type: string
          example: plan
          enum:
            - plan
            - order
          description: |-
            Represents the medication request purpose. Dictionary MEDICATION_REQUEST_INTENT

            - `plan` — The request represents an intention to ensure something occurs without providing an authorization for others to act.
            - `order` — The request represents a request/demand and authorization for action.
        category:
          type: string
          example: community
          enum:
            - community
          description: |-
            Type of medication usage. Dictionary MEDICATION_REQUEST_CATEGORY

            - `community` — Includes requests for medications to be administered or consumed by the patient in their home
        based_on:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Reference'
              - type: object
                properties:
                  identifier:
                    allOf:
                      - $ref: '#/components/schemas/Identifier'
                      - type: object
                        required:
                          - type
                          - value
                        properties:
                          type:
                            allOf:
                              - $ref: '#/components/schemas/Codeable_Concept'
                              - type: object
                                required:
                                  - coding
                                properties:
                                  coding:
                                    type: array
                                    items:
                                      allOf:
                                        - $ref: '#/components/schemas/Coding'
                                        - type: object
                                          properties:
                                            system:
                                              type: string
                                              example: eHealth/resources
                                            code:
                                              type: string
                                              example: care_plan
                                  text:
                                    type: string
                          value:
                            type: string
                            example: 9183a36b-4d45-4244-9339-63d81cd08d9c
          example:
            - identifier:
                type:
                  coding:
                    - system: eHealth/resources
                      code: care_plan
                value: 9183a36b-4d45-4244-9339-63d81cd08d9c
            - identifier:
                type:
                  coding:
                    - system: eHealth/resources
                      code: activity
                value: 9183a36b-4d45-4244-9339-63d81cd08d9c
        context:
          allOf:
            - $ref: '#/components/schemas/Reference'
            - type: object
              properties:
                identifier:
                  allOf:
                    - $ref: '#/components/schemas/Identifier'
                    - type: object
                      required:
                        - type
                        - value
                      properties:
                        type:
                          allOf:
                            - $ref: '#/components/schemas/Codeable_Concept'
                            - type: object
                              required:
                                - coding
                              properties:
                                coding:
                                  type: array
                                  items:
                                    allOf:
                                      - $ref: '#/components/schemas/Coding'
                                      - type: object
                                        properties:
                                          system:
                                            type: string
                                            example: eHealth/resources
                                          code:
                                            type: string
                                            example: encounter
                                text:
                                  type: string
                        value:
                          type: string
                          example: 9183a36b-4d45-4244-9339-63d81cd08d9c
        dosage_instruction:
          type: array
          items:
            $ref: '#/components/schemas/Dosage_Instruction'
        reject_reason:
          type:
            - string
            - 'null'
          example: Incompatible drugs
          description: Medication request reject reason
        reject_reason_code:
          type:
            - string
            - 'null'
          example: PATIENT_REJECT
          description: '`Dictionary MEDICATION_REQUEST_REJECT_REASON`'
        block_reason:
          type: string
          example: Підозра на фрод
          description: Block or unblock reason description
        block_reason_code:
          type: string
          example: BLOCK_WRONG_QTY_DRUG
          description: Block or unblock reason code `Dictionary MEDICATION_REQUEST_BLOCK_REASON`
        priority:
          type: string
          example: routine
          enum:
            - routine
            - urgent
            - asap
            - stat
        prior_prescription:
          type: object
          properties:
            identifier:
              type: object
              required:
                - type
                - value
              properties:
                type:
                  type: object
                  required:
                    - coding
                  properties:
                    coding:
                      type: array
                      items:
                        type: object
                        properties:
                          system:
                            type: string
                            example: eHealth/resources
                          code:
                            type: string
                            example: medication_request
                    text:
                      type: string
                value:
                  type: string
                  example: 9183a36b-4d45-4244-9339-63d81cd08d9c
        container_dosage:
          type: object
          required:
            - system
            - code
            - value
          properties:
            system:
              type: string
              example: MEDICATION_UNIT
            code:
              type: string
              example: ML
            value:
              type: number
              example: 4
        note:
          type: string
          example: some additional info
          description: Additional information
        blocked_to:
          type:
            - string
            - 'null'
          example: '2021-12-18T14:40:16Z'
          description: Blocked to date - ISO 8601 date and time in UTC timezone.
        blocked_by_legal_entity:
          allOf:
            - $ref: '#/components/schemas/blocked_by_legal_entity_short'
            - type: object
              required:
                - id
              properties:
                id:
                  type: string
                  example: b075f148-7f93-4fc2-b2ec-2d81b19a9b7b
          description: Legal entity identifier who blocked MR
