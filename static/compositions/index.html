<!DOCTYPE html>
<html lang="uk">
  <head>
    <title>Compositions | eHealth API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <style>body { margin: 0; padding: 0; }</style>
  </head>
  <body>
    <!--
      A STATIC spec: Compositions (медичні висновки) is maintained outside the apiary-derived services (formerly on SwaggerHub,
      ehealthua/compositions, version "Prod"), so it is NOT a base/<service>/<env>.yaml service of the main page. Published once,
      on PROD only (build/assemble_site.sh copies static/* into the prod site), at /compositions/. openapi.yaml is the SwaggerHub
      document verbatim. Same pinned Scalar bundle as the main page (../assets/). "Try it" is off, as on the other static specs.
      The admin-panel companion lives at an unlisted path; do not link it from here.
    -->
    <div id="app"></div>
    <script src="../assets/scalar.standalone.js?v=1.62.9-ehealth-custom.451f9950"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: 'openapi.yaml',
        hideTestRequestButton: true,
        orderSchemaPropertiesBy: 'preserve',
        orderRequiredPropertiesFirst: false,
      });
    </script>
  </body>
</html>
