# nginx config for the self-contained `portal/` static deploy (sandbox demo).
# Mirrors the serving guidance in portal/README.md so the sandbox behaves like a
# real deploy: gzip the multi-MB YAML, serve it as text/yaml, cache the pinned
# assets/ immutably and the specs/ short.

gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types        text/plain text/css application/javascript application/x-yaml text/yaml image/svg+xml application/json;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;   # the portal/ folder
    index index.html;

    # Pinned, content-addressed (?v=) — safe to cache forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Specs change on every rebuild — serve as text/yaml, no-cache, CORS-open
    # (so the docs can also be embedded cross-origin).
    location /specs/ {
        types          { }
        default_type   text/yaml;
        add_header     Cache-Control               "no-cache" always;
        add_header     Access-Control-Allow-Origin "*"        always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
