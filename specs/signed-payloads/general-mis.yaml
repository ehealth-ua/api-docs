              properties:
                coding:
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/Coding'
                      - type: object
                        properties:
                          system:
                            type: string
                            example: TIMING_ABBREVIATIONS
                          code:
                            type: string
                            example: patient
                text:
                  type: string
    Duration:
