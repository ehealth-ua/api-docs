                  settlement_type:
                    example: CITY
                  settlement_id:
                    example: b075f148-7f93-4fc2-b2ec-2d81b19a9b7b
                  street_type:
                    example: STREET
                  street:
                    example: вул. Ніжинська
                  building:
                    example: '15'
                  apartment:
                    example: '23'
                  zip:
                    example: '02090'
        phones:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Phone'
              - type: object
                properties:
                  type:
                    example: MOBILE
                  number:
                    example: '+380503410870'
        email:
          type: string
          description: division's email
        working_hours:
          $ref: '#/components/schemas/workinghours'
          description: optional field, business hours by each day weekly, doesn't make any influence on business process and will be shown on portal and map.
        mountain_group:
          type: boolean
    External_contractors:
      type: object
      required:
        - legal_entity_id
        - contract
        - divisions
      properties:
        legal_entity_id:
          type: string
          description: external_contractor ID
          example: 443e901e-b365-45d2-be14-083ee0aba657
        contract:
          type: object
          required:
            - number
            - issued_at
            - expires_at
          properties:
            number:
              type: string
              description: number of contract with sub contractor
              example: '1234567'
            issued_at:
              type: string
              description: issue date of contract with sub contractor
              example: '2018-01-01'
            expires_at:
              type: string
              description: expiry date of contract with sub contractor
              example: '2019-01-01'
        divisions:
          type: array
          items:
            $ref: '#/components/schemas/Divisions'
    Payment_details:
      type: object
      required:
        - bank_name
        - payer_account
      properties:
        bank_name:
          type: string
          description: bank name
          example: Банк №1
        MFO:
          type: string
          description: bank code, required for account number
          example: '351005'
        payer_account:
          type: string
          description: Account number or International Bank Account Number
          example: UA3412345678901234567890
    Ingredient_v2:
      type: object
      required:
        - id
        - name
        - name_original
        - dosage
        - is_primary
      properties:
        id:
          type: string
          example: 1349a693-4db1-4a3f-9ac6-8c2f9e541982
        name:
          type: string
          example: Інсулін деглюдек
        name_original:
          type: string
          example: "Insulin degludec"
        sctid:
          type: string
          example: "52574003"
          description: innm CNOMED code
        dosage:
          $ref: '#/components/schemas/Dosage_drug'
        is_primary:
          type: boolean
          example: true
    PartyDocument:
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          description: '`Dictionary DOCUMENT_TYPE`'
        number:
          type: string
          description: document issue number
        issued_by:
          type: string
          description: authority which issued the document
        issued_at:
          type: string
          description: the date when document was issued
