openapi: 3.1.0
info:
  title: eHealth Trusted PIS API — DEMO
  version: "9.13.0 v.1"
  description: |-
    **Version: 9.13.0 v.1**

    Environment: **DEMO**

    This is a **Trusted PIS-related sign-in and sign-up part** of API documentation for Ukrainian Health Services government institution back-end, that should provide:

    * Patient sign-in

    * Patient sign-in by confidant person

    * Patient sign-up

    * Patient sign-up by confidant person

    * Patient data management

    > In order to get specification for PIS-related consumers part of API documentation please proceed [here](/?r=1#ehealth-pis)

    ## API Conventions
    
    **Request ID.** Send a request-tracing value in the `X-Request-ID` header; the same value is echoed back in every response, in the `meta.request_id` field. Quote it when reporting an issue so support can locate the exact request server-side.
    
    **Idempotency Key.** For requests that support safe retries, send a client-generated value in the `X-Idempotency-Key` header; a repeated request with the same key and body returns the original response instead of re-executing the operation. The response echoes it back in `meta.idempotency_key`.
    
    **Error format.** Every error response follows the same envelope: `meta` (as above) plus an `error` object with `type` (a machine-readable error code) and `message` (a human-readable, developer-facing description).
    
servers:
  - url: https://api-demo.ehealth.gov.ua
    description: DEMO — eHealth ehealth-trusted-pis API
tags:
  - name: Public. Patient Information System
    description: 'The table below reflects actual API endpoints for all the eHealth environments


      Env     | Host

      --------|-----

      DEMO    | https://api-demo.ehealth.gov.ua

      PREPROD | https://api-preprod.ehealth.gov.ua

      PROD    | https://api.ehealth.gov.ua


      **Notes:**


      - Every sign-in and sign-up method described here must be used only by Clients with `TRUSTED_PIS` client type.


      - When `access_token` expires, Client must renew it using `refresh_token` with [Use Refresh Token for Access Token extension](/#ehealth-trusted-pis/tag/public-patient-information-system/POST/oauth/tokens) method.


      **API-key:**


      - For identifiers of PIS clients (as a broker) we use term api-key. PIS must **mandatory** send api-key when called any eHealth API.


      - api-key is a `pis_client_secret` - Patient Information System secret key issued upon integration request.


      - api-key is dispatched in Request HEADER as a `API-key` attribute.


      - If PIS don''t send api-key in Request HEADER, API return 401 error wih message "API-KEY header required".'
  - name: Public. Dummy methods
