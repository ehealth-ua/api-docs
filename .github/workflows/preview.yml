# Прев'ю на кожен коміт у PR у main — для кожного середовища, яке зачіпає PR
# (за шляхами, build/changed_envs.sh).
# Хост прев'ю: <PR-number>.docs-<env>.ehealth.gov.ua (prod: <PR-number>.docs.ehealth.gov.ua).
# Збірка працює вже зараз і лишає сайт як artifact; крок публікації на хост
# позначено TODO і чекає на сервер.
name: preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# Один запуск на PR; новий коміт скасовує попередній.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  target:
    if: github.event.action != 'closed'
    name: Resolve environments
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.resolve.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        run: |
          envs=$(build/changed_envs.sh --json "origin/${{ github.base_ref }}" HEAD)
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  build-preview:
    name: Preview (${{ matrix.env }} PR #${{ github.event.number }})
    needs: target
    if: needs.target.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.target.outputs.envs) }}
    env:
      BASE_REF: ${{ github.base_ref }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # час деплою сервісу береться з git-історії

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve host
        id: target
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          case "$ENV_NAME" in
            prod)                     host="${PR_NUMBER}.docs.ehealth.gov.ua" ;;
            preprod|stage|demo)       host="${PR_NUMBER}.docs-${ENV_NAME}.ehealth.gov.ua" ;;
            *) echo "unexpected environment" >&2; exit 1 ;;
          esac
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        run: build/assemble_site.sh "${{ matrix.env }}" _site

      - name: Stamp deploy badge
        run: |
          # сервіси, які змінює цей PR, отримують поточний час
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" \
            | sed -n -E 's#^(base|overlay)/([^/]+)/.*#\2#p' | sort -u | paste -sd, -)
          build/stamp_deploy_badge.sh _site/index.html "${{ matrix.env }}" --now "$changed"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.number }}-${{ matrix.env }}
          path: _site
          retention-days: 7

      # TODO(DevOps): опублікувати ./_site на ефемерний хост (Cloudflare Pages /
      # S3 / nginx vhost) і вивести URL. Сервер ще не готовий.
      - name: Publish preview (pending server)
        run: |
          echo "Preview site is built and uploaded as artifact preview-${PR_NUMBER}-${{ matrix.env }}."
          echo "TODO(DevOps): publish to ${{ steps.target.outputs.host }}"
          echo "::notice title=Preview not published::Hosting is not configured yet. Download the artifact."

  teardown-preview:
    if: github.event.action == 'closed'
    name: Teardown preview (PR #${{ github.event.number }})
    runs-on: ubuntu-latest
    steps:
      # TODO(DevOps): прибрати прев'ю-хост цього PR, коли він з'явиться.
      - name: Teardown (pending server)
        run: |
          echo "TODO(DevOps) teardown preview host for PR ${{ github.event.number }}"
