<!DOCTYPE html>
<html lang="uk">
  <head>
    <title>PIS Private API | eHealth API</title>
    <meta property="og:title" content="PIS Private API | eHealth API" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <style>body { margin: 0; padding: 0; }</style>

  <body>
    <!--
      A STATIC spec, UNLISTED: the PIS private methods (used only by the eHealth Auth service / Auth front-end), ported from the Apiary
      project ehealthpisapi (groups "Private. Patient Information System" and "Private. Dummy methods", the latter as Payload: siblings).
      Public but not advertised: the random suffix in the path keeps it from being guessed, and nothing on the site links here
      (keep it that way; noindex above). This is obscurity, not access control. Published once, on PROD only
      (build/assemble_site.sh copies static/* into the prod site). openapi.yaml is a generated file (from the Apiary source above); it is not edited by hand.
    -->
    <div id="app"></div>
    <script src="../assets/scalar.standalone.js?v=1.62.9-ehealth-custom.451f9950"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: 'openapi.yaml',
        hideTestRequestButton: true,
        orderSchemaPropertiesBy: 'preserve',
        orderRequiredPropertiesFirst: false,
      });
    </script>
  </body>
</html>
