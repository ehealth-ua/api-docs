      summary: Confidant patient sign-in
      operationId: Confidant patient sign-in
      description: |-
        This endpoint is used to authenticate, approve scopes and sign-in as a confidant patient.

        > **Note:** It could be done only if there is a registered relation between actor (authenticated patient) and related patient

        If user does not exist - search for active patient and create user.

        This endpoint must be used only by trusted PIS clients.

        Signed content must contain patient data to search and identify patient and validate relation

        Look at [**Dummy Confidant patient sign-in**](/#ehealth-trusted-pis/tag/public-patient-information-system/POST/api/pis/confidant/sign-in/decoded-payload) for more details
      tags:
        - Public. Patient Information System
      parameters:
        - name: api-key
          in: header
          description: e.g. uXhEczJ56adsfh3Ri9SUkc4en
          required: true
          schema:
            type: string
          example: uXhEczJ56adsfh3Ri9SUkc4en
      requestBody:
        content:
          application/json:
            example:
              signed_content: 
              signed_content_encoding: base64
              token:
                grant_type: pis_auth
                client_id: 4fc161ad-5e3d-4c5e-9a9e-189e2ddffe56
                client_secret: UXhEczJacXh3Ri9SUkc4enhHTVVpQ119
                scope: declaration_request:read declaration_request:terminate declaration:read person:read app:read authentication_factor:read profile:read
            schema:
              type: object
              properties:
                signed_content_encoding:
                  example: "base64"
                  type: string
                token:
                  type: object
                  properties:
                    grant_type:
                      example: "pis_auth"
                      type: string
                      enum:
                        - pis_auth
                      description: Auth Grant Type. Currently only `pis_auth` is supported.
                    client_id:
                      example: "4fc161ad-5e3d-4c5e-9a9e-189e2ddffe56"
                      type: string
                      description: Patient information system ID. Used to identify the context of the PIS.
                    client_secret:
                      example: "UXhEczJacXh3Ri9SUkc4enhHTVVpQ119"
                      type: string
                      description: Patient information system secret key issued upon integration request. Used to identify application developer.
                    scope:
                      example: "declaration_request:read declaration_request:terminate declaration:read person:read app:read authentication_factor:read profile:read"
                      type: string
                      description: List of scopes that is required in application business logic, separated by space.
                  required:
                    - grant_type
                    - client_id
                    - client_secret
                    - scope
              required:
                - signed_content
                - signed_content_encoding
                - token
        required: true
        description: |-
          <!-- signed-payload-xref -->
          > 🔒 **Signed content** — The request body is submitted as the base64 of a digitally-signed (КЕП / UA-EDS) document. Decoded payload schema: **[Payload: Confidant patient sign-in](/#ehealth-trusted-pis/tag/public-patient-information-system/POST/api/pis/confidant/sign-in/decoded-payload)**.
          <!-- /signed-payload-xref -->

          **Signed request.** Send only **`signed_data`** — the base64 of a digitally-signed (КЕП / UA-EDS) document.

           The decoded structure of `signed_data` is `Person_Request_PIS`, [documented here](/#ehealth-trusted-pis/tag/public-patient-information-system/POST/api/pis/confidant/sign-in/decoded-payload).
      x-signed-content-schema: '#/components/schemas/Person_Request_PIS'
  /api/pis/confidant/sign-in/decoded-payload:
    post:
      tags:
        - Public. Patient Information System
      summary: 'Payload: Confidant patient sign-in'
      operationId: dummy-post-api-pis-confidant-sign-in
      description: |-
        This is Apiary's own **Dummy** test-method body for this operation (`POST /dummy/pis/confidant/sign-in`) -- a plain (unsigned), much smaller reference payload Apiary provides for MIS integration testing, distinct from the real signed `Person_Request_PIS` content (verified separately). → [Confidant patient sign-in](/#ehealth-trusted-pis/tag/public-patient-information-system/POST/api/pis/confidant/sign-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - last_name
                - given_name
              properties:
                last_name:
                  type: string
                  example: Петров
                given_name:
                  type: string
                  example: Петро Петрович
                tax_id:
                  type: string
                  example: '2323232323'
                document:
                  type: object
                  required:
                    - type
                    - number
                  properties:
                    type:
                      type: string
                      example: PASSPORT
                      description: '`Dictionary DOCUMENT_TYPE`'
                    number:
                      type: string
                      example: АА120518
                      description: document issue number
      responses:
        '200':
          description: Success
