          example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9
          schema:
            type: string
  /oauth/tokens:
    post:
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/Response__Meta'
                    - type: object
                      properties:
                        code:
                          example: 201
                        url:
                          example: "https://example.com/resource"
                        type:
                          example: "object"
                        request_id:
                          example: "6617aeec-15e2-4d6f-b9bd-53559c358f97#17810"
                  data:
                    type: object
                    properties:
                      value:
                        example: "SnNRdCtvU0tTOENBV2dLRUZwNmIzZz09"
                        type: string
                        description: oAuth access token.
                      user_id:
                        example: "3ff33ced-69dc-415a-b231-c6446898335a"
                        type: string
                        description: User identifier
                      user:
                        type: object
                        properties:
                          person_id:
                            example: "2b5e9656-8750-49b3-8c5c-b9c344f8fe52"
                            type: string
                            description: Person identifier that is linked to user
                        description: Additional user params
                      name:
                        example: "change_password_token"
                        type: string
                        description: oAuth token name
                      id:
                        example: "3ff33ced-69dc-415a-b231-c6446898335a"
                        type: string
                        description: oAuth token identifier
                      expires_at:
                        example: 1498749591
                        type: number
                        description: expiration date-time timestamp
                      details:
                        type: object
                        properties:
                          app_id:
                            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                            type: string
                            description: Identifier of approval between user, applicant user and client that was used to issue access token
                          applicant_user_id:
                            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                            type: string
                            description: Identifier of user that initiated access token generation
                          applicant_person_id:
                            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                            type: string
                            description: Identifier of person that is accosiated with user who initiated access token generation
                          scope:
                            example: "capitation_contracts:view capitation_contracts:create patients:view patients:create"
                            type: string
                            description: List of scopes that is required in application business logic, separated by space
                          grant_type:
                            example: "refresh_token"
                            type: string
                          client_id:
                            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                            type: string
                            description: Client ID of authorized user.
                        required:
                          - scope
                          - client_id
                    required:
                      - value
                      - user_id
                      - user
                      - name
                      - id
                      - expires_at
                      - details
                    additionalProperties: false
                  paging:
                    type: object
                    properties:
                      limit:
                        example: 20
                        type: number
                        description: 'A limit on the number of objects to be returned, between 1 and 100. Default: 50.'
                      cursors:
                        type: object
                        properties:
                          starting_after:
                            example: "56c31536a60ad644060041af"
                            type: string
                            description: A cursor for use in pagination. An object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with `obj_foo`, your subsequent call can include `starting_after=obj_foo` in order to fetch the next page of the list.
                          ending_before:
                            example: "56c31536a60ad644060041aa"
                            type: string
                            description: A cursor for use in pagination. An object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, starting with `obj_bar`, your subsequent call can include `ending_before=obj_bar` in order to fetch the previous page of the list.
                      size:
                        example: 1000
                        type: number
                        description: Total number of objects in collection.
                      has_more:
                        example: false
                        type: boolean
                        description: Is this collection have more data to load in the same style as last request loaded it.
                    required:
                      - limit
                      - cursors
                      - size
                      - has_more
                    additionalProperties: false
              example:
                meta:
                  code: 201
                  url: https://example.com/resource
                  type: object
                  request_id: 6617aeec-15e2-4d6f-b9bd-53559c358f97#17810
                data:
                  value: SnNRdCtvU0tTOENBV2dLRUZwNmIzZz09
                  user_id: 3ff33ced-69dc-415a-b231-c6446898335a
                  user:
                    person_id: 2b5e9656-8750-49b3-8c5c-b9c344f8fe52
                  name: change_password_token
                  id: 3ff33ced-69dc-415a-b231-c6446898335a
                  expires_at: 1498749591
                  details:
                    app_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    applicant_user_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    applicant_person_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    scope: capitation_contracts:view capitation_contracts:create patients:view patients:create
                    grant_type: refresh_token
                    client_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                paging:
                  limit: 20
                  cursors:
                    starting_after: 56c31536a60ad644060041af
                    ending_before: 56c31536a60ad644060041aa
                  size: 1000
                  has_more: false
      summary: Use Refresh Token for Access Token extension
      operationId: Use Refresh Token for Access Token extension
      description: 'This endpoint is used to renew access token using refresh token.


        It is available to renew access token as many time as needed during the lifetime of refresh token.'
      tags:
        - Public. Patient Information System
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              token:
                client_id: 6498d88e-97fb-47e2-85a5-99e884f888aa
                client_secret: msp-001-secret-key
                refresh_token: my-oauth-refresh-token
                grant_type: refresh_token
            schema:
              type: object
              properties:
                token:
                  type: object
                  properties:
                    client_id:
                      example: "6498d88e-97fb-47e2-85a5-99e884f888aa"
                      type: string
                      description: Medical Service provider ID issued after legal_entity registration. Used to identify the context of the MSP/Pharmacy.
                    client_secret:
                      example: "msp-001-secret-key"
                      type: string
                      description: Medical Service provider secret key issued upon integration request. Used to identify MSP.
                    refresh_token:
                      example: "my-oauth-refresh-token"
                      type: string
                      description: oAuth refresh token.
                    grant_type:
                      example: "refresh_token"
                      type: string
                      enum:
                        - refresh_token
                      description: oAuth Grant Type. Currently only `authorization_code` is supported.
                  required:
                    - client_id
                    - client_secret
                    - refresh_token
                    - grant_type
  /auth/logout:
