# nginx config for the static `portal/` deploy.
# Reference for serving: gzip the multi-MB YAML, serve it as text/yaml, cache the
# pinned assets/ immutably and the generated dist/ and base/ short.

gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types        text/plain text/css application/javascript application/x-yaml text/yaml image/svg+xml application/json;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;   # the published site root
    index index.html;

    # Pinned, content-addressed (?v=) — safe to cache forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Source specs — served as text/yaml, no-cache, CORS-open
    # (so the docs can also be embedded cross-origin).
    location /base/ {
        types          { }
        default_type   text/yaml;
        add_header     Cache-Control               "no-cache" always;
        add_header     Access-Control-Allow-Origin "*"        always;
    }

    # Scalar-preprocessed JSON per environment (what index.html loads) —
    # regenerated with every spec change, so the same no-cache rule.
    location /dist/ {
        add_header     Cache-Control               "no-cache" always;
        add_header     Access-Control-Allow-Origin "*"        always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
