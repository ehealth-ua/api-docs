                  has_more: false
      summary: Logout
      operationId: Logout
      description: 'This endpoint is used to terminate users authenticated session based on a valid access token.


        Refresh token from authenticated session will also be expired.'
      tags:
        - Public. Patient Information System
      parameters:
        - name: Authorization
          in: header
          description: e.g. Bearer c2778f3064753ea70de870a53795f5c9
          required: true
          schema:
            type: string
          example: Bearer c2778f3064753ea70de870a53795f5c9
