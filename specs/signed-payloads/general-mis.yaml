openapi: 3.1.0
info:
  title: GENERAL MIS API — Signed Content (decoded payloads)
  version: 1.0.0
  description: Decoded `signed_content` payloads for signed endpoints. Each entry shows the structure to build, sign (КЕП / UA-EDS), base64-encode and place into `signed_content`. → [GENERAL MIS API](reference.html)
tags:
  - name: Deprecated methods
  - name: Public. Medical Service Provider Integration Layer
  - name: Public. Contracts
  - name: Public. Reimbursement
paths:
  /api/person_requests/{id}/actions/sign:
    patch:
      tags:
        - Deprecated methods
      summary: 'Payload: Sign Person Request'
      operationId: dummy-patch-api-person-requests-id-actions-sign
      description: Build, sign (КЕП / UA-EDS) and base64-encode **`Person_info_Public`** into `signed_content`. → [Sign Person Request](/#general-mis/tag/deprecated-methods/PATCH//api/person_requests/{id}/actions/sign)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - id
                - person
                - patient_signed
                - process_disclosure_data_consent
                - content
                - channel
              properties:
                status:
                  type: string
                  example: APPROVED
                id:
                  type: string
                  example: eeebb86d-5cba-43c9-885b-6482ecaf826b
                person:
                  allOf:
                    - type: object
                      properties:
                        id:
                          type: string
                          example: 13001c60-45a0-4b5a-b425-9505e1de18bd
                          description: MPI id of the person
                    - $ref: '#/components/schemas/Person_info_Public'
                patient_signed:
                  type: boolean
                  example: true
                  description: Person's evidence of sign the person request
                process_disclosure_data_consent:
                  type: boolean
                  example: true
                  description: Person's evidence of information about consent to data disclosure
                content:
                  type: string
                  example: <html><body><p>signed person data</p></body></html>
                  description: HTML document that MUST be shown to a end-user and signed by his key.
                channel:
                  type: string
                  example: MIS
                  description: channel that invoke patient create service
            example:
              status: APPROVED
              id: eeebb86d-5cba-43c9-885b-6482ecaf826b
              person:
                id: 13001c60-45a0-4b5a-b425-9505e1de18bd
                first_name: Петро
                last_name: Іванов
                second_name: Миколайович
                birth_date: '2009-07-05'
                birth_country: Україна
                birth_settlement: Вінниця
                gender: MALE
                email: email@example.com
                no_tax_id: false
                tax_id: '3999869394'
                secret: secret
                documents:
                  - type: BIRTH_CERTIFICATE
                    number: АА120518
                    issued_by: Рокитнянським РВ ГУ МВС Київської області
                    issued_at: '2017-02-28'
                    expiration_date: '2027-02-28'
                addresses:
                  - type: RESIDENCE
                    country: UA
                    area: Житомирська
                    region: Бердичівський
                    settlement: Київ
                    settlement_type: CITY
                    settlement_id: b075f148
                    street_type: STREET
                    street: вул. Ніжинська
                    building: '15'
                    apartment: '23'
                    zip: '02090'
                phones:
                  - type: MOBILE
                    number: '+380503410870'
                authentication_methods:
                  - type: THIRD_PERSON
                    value: '+380508887700'
                    alias: husband
                unzr: 20090705-00011
                emergency_contact:
                  first_name: Петро
                  last_name: Іванов
                  second_name: Миколайович
                  phones:
                    - type: MOBILE
                      number: '+380503410870'
                confidant_person:
                  - relation_type: PRIMARY
                    first_name: Петро
                    last_name: Іванов
                    second_name: Миколайович
                    birth_date: '1972-10-26'
                    birth_country: Україна
                    birth_settlement: Вінниця
                    gender: MALE
                    tax_id: '2659719350'
                    secret: secret
                    documents_person:
                      - type: PASSPORT
                        number: АА120518
                        issued_by: Рокитнянським РВ ГУ МВС Київської області
                        issued_at: '2017-02-28'
                    documents_relationship:
                      - type: PASSPORT
                        number: АА120518
                        issued_by: Рокитнянським РВ ГУ МВС Київської області
                        issued_at: '2017-02-28'
                    phones:
                      - type: MOBILE
                        number: '+380503410870'
                    email: emaill@example.com
                preferred_way_communication: email
              patient_signed: true
              process_disclosure_data_consent: true
              content: <html><body><p>signed person data</p></body></html>
              channel: MIS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Patient_short'
              example:
                data:
                  person_id: b075f148-7f93-4fc2-b2ec-2d81b19a9b7b
