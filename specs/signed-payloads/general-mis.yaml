                  example: 2
                  description: Number of times to repeat
                count_max:
                  type: number
                  example: 4
                  description: Maximum number of times to repeat
                duration:
                  type: number
                  example: 4
                  description: How long when it happens
                duration_max:
                  type: number
                  example: 6
                  description: How long when it happens Max
                duration_unit:
                  type: string
                  example: d
                  description: unit of time UCUM
                frequency:
                  type: number
                  example: 1
                  description: Event occurs frequency times per period
                frequency_max:
                  type: number
                  example: 2
                  description: Event occurs up to frequencyMax times per period
                period:
                  type: number
                  example: 4
                  description: Event occurs frequency times per period
                period_max:
                  type: number
                  example: 6
                  description: Upper limit of period
                period_unit:
                  type: string
                  example: d
                  description: unit of time UCUM
                day_of_week:
                  type: array
                  items:
                    type: string
                    example: mon
                  description: day of week
                time_of_day:
                  type: array
                  items:
                    type: string
                    example: "2017-04-20T19:14:13Z"
                  description: Time of day for action
                when:
                  type: array
                  items:
                    type: string
                    example: WAKE
                  description: Regular life events the event is tied to
                offset:
                  type: number
                  example: 4
                  description: Minutes from event before or after
              type: object
        code:
          allOf:
            - $ref: '#/components/schemas/Codeable_Concept'
