openapi: 3.1.0
info:
  title: eHealth PIS API — PROD
  version: "9.11.0.3 v.2"
  description: '**Version: 9.11.0.3 v.2**


    Environment: **PROD**


    This is a **PIS-related consumers part** of API documentation for Ukrainian Health Services government institution back-end, that should provide:


    * Patient sign-in with oAuth flow


    * Patient sign-in by confidant person with oAuth flow


    * Patient sign-up with oAuth flow


    * Patient sign-up by confidant person with oAuth flow


    * Patient data management (person details, person authentication methods, declarations, etc)


    ## Docs Structure


    This document contains both private and public (usually `/api/..`) API specifications. If you plan to use it as outside API consumer - please refer only to sections that marked as `Public`.


    The table below lists the actual API endpoints for all eHealth environments:


    Env     | Host

    --------|-----

    DEMO    | https://auth-demo.ehealth.gov.ua

    PREPROD | https://auth-preprod.ehealth.gov.ua

    PROD    | https://auth-preprod.ehealth.gov.ua'
servers:
  - url: https://api.ehealth.gov.ua
    description: PROD — eHealth ehealth-pis API
tags:
  - name: Public. Patient Information System
    description: "**Attention!**\nUse following HOSTs for oAuth 2.0 Authentication\n\nEnv     | Host\n--------|-----\nDEMO    | http://my-demo.ehealth.gov.ua \nPREPROD | https://my-preprod.ehealth.gov.ua\nPROD    | https://my.ehealth.gov.ua"
paths:
  /oauth/nonce:
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/Response__Meta'
                    - type: object
                      properties:
                        code:
                          example: 200
                        url:
                          example: "https://example.com/resource"
                        type:
                          example: "object"
                        request_id:
                          example: "6617aeec-15e2-4d6f-b9bd-53559c358f97#17810"
                  data:
                    type: object
                    properties:
                      token:
                        example: "'eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJtaXRocmlsLWxvZ2luIiwiZXhwIjoxNTIzNDM5MjAxLCJpYXQiOjE1MjM0MzgzMDEsImlzcyI6IkVIZWFsdGgiLCJqdGkiOiJlZmUxZjA4ZS1kNGI0LTRjZWYtYTAyYy03OGVhNGExZGRhMjUiLCJuYmYiOjE1MjM0MzgzMDAsIm5vbmNlIjoxMjMsInN1YiI6MTIzLCJ0eXAiOiJhY2Nlc3MifQ.UZ6S92h3nAG"
                        type: string
                    required:
                      - token
                    additionalProperties: false
                  paging:
                    type: object
                    properties:
                      limit:
                        example: 20
                        type: number
                        description: 'A limit on the number of objects to be returned, between 1 and 100. Default: 50.'
                      cursors:
                        type: object
                        properties:
                          starting_after:
                            example: "56c31536a60ad644060041af"
                            type: string
                            description: A cursor for use in pagination. An object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with `obj_foo`, your subsequent call can include `starting_after=obj_foo` in order to fetch the next page of the list.
                          ending_before:
                            example: "56c31536a60ad644060041aa"
                            type: string
                            description: A cursor for use in pagination. An object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, starting with `obj_bar`, your subsequent call can include `ending_before=obj_bar` in order to fetch the previous page of the list.
                      size:
                        example: 1000
                        type: number
                        description: Total number of objects in collection.
                      has_more:
                        example: false
                        type: boolean
                        description: Is this collection have more data to load in the same style as last request loaded it.
                    required:
                      - limit
                      - cursors
                      - size
                      - has_more
                    additionalProperties: false
              example:
                meta:
                  code: 200
                  url: https://example.com/resource
                  type: object
                  request_id: 6617aeec-15e2-4d6f-b9bd-53559c358f97#17810
                data:
                  token: '''eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJtaXRocmlsLWxvZ2luIiwiZXhwIjoxNTIzNDM5MjAxLCJpYXQiOjE1MjM0MzgzMDEsImlzcyI6IkVIZWFsdGgiLCJqdGkiOiJlZmUxZjA4ZS1kNGI0LTRjZWYtYTAyYy03OGVhNGExZGRhMjUiLCJuYmYiOjE1MjM0MzgzMDAsIm5vbmNlIjoxMjMsInN1YiI6MTIzLCJ0eXAiOiJhY2Nlc3MifQ.UZ6S92h3nAG'
                paging:
                  limit: 20
                  cursors:
                    starting_after: 56c31536a60ad644060041af
                    ending_before: 56c31536a60ad644060041aa
                  size: 1000
                  has_more: false
      summary: Get nonce
      operationId: Get nonce
      description: This endpoint allows to get nonce (one time JWT) for active client of the system.
      tags:
        - Public. Patient Information System
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              client_id: 30074b6e-fbab-4dc1-9d37-88c21dab1847
              client_secret: c2778f3064753ea70de870a53795f5c9
            schema:
              type: object
              properties:
                client_id:
                  example: "30074b6e-fbab-4dc1-9d37-88c21dab1847"
                  type: string
                  description: Client identifier in the system.
                client_secret:
                  example: "c2778f3064753ea70de870a53795f5c9"
                  type: string
                  description: Required only for clients with `TRUSTED_PIS` client type.
              required:
                - client_id
  /sign-in:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content: {}
      summary: Patient sign-in
      operationId: Patient sign-in
      description: 'You MUST redirect your users to this URL to obtain oAuth Code Grant (which is later exchanged to Access Token).


        User will see rendered login page, which structure differ by a list of requested scopes and security measures applied by DevOps team.


        For security purposes, we will set `X-Frame-Options: deny` header that will disallow opening this page in an iframe.'
      tags:
        - Public. Patient Information System
      parameters:
        - name: client_id
          in: query
          description: Medical Service provider ID issued after legal_entity registration. Used to identify the context of the MSP/Pharmacy.
          required: true
          example: 6498d88e-97fb-47e2-85a5-99e884f888aa
          schema:
            type: string
        - name: redirect_uri
          in: query
          description: URL where user will be redirected after authentification. This url will receive `code` and `state` parameters in query string.
          required: true
          example: https://example.com/
          schema:
            type: string
        - name: scope
          in: query
          description: List of scopes that is required in application business logic, separated by space. Different login forms will be shown based on scopes that you requested.
          required: true
          example: capitation_contracts:view capitation_contracts:create patients:view patients:create
          schema:
            type: string
        - name: user_data
          in: query
          description: Auth request signed on client side
          example: base64_string
          schema:
            type: string
        - name: state
          in: query
          description: Randomly generated, opaque, and non-guessable string generated by client that will be transferred to client with grant code
          example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9
          schema:
            type: string
