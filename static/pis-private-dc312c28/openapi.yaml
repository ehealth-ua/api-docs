openapi: 3.1.0
info:
  title: eHealth PIS Private API
  version: 1.0.0
  description: |-
    Private methods of the eHealth Patient Information System (PIS) used only by the eHealth Auth service and the Auth front-end client.
    These endpoints are not available to outside API consumers.
tags:
  - name: Private. Patient Information System
    description: |-
      This set of endpoints are private and used only by eHealth Auth service.

      This endpoints shouldn't be obtained by outside API consumers.
paths:
  /auth/login:
    post:
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: number
                        description: HTTP response code.
                      url:
                        type: string
                        description: URL to requested resource.
                      type:
                        type: string
                        enum:
                          - object
                          - list
                        description: Type of data that is located in `data` attribute.
                      request_id:
                        type: string
                        description: '[Request ID](https://docs.apimanifest.apiary.io/#introduction/interacting-with-api/request-id). Send it with `X-Request-ID` header.'
                    required:
                      - code
                      - url
                      - type
                      - request_id
                    additionalProperties: false
                  data:
                    type: object
                    properties:
                      value:
                        type: string
                        description: oAuth access token.
                      user_id:
                        type: string
                        description: User identifier
                      user:
                        type: object
                        properties:
                          person_id:
                            type: string
                            description: Person identifier that is linked to user
                        description: Additional user params
                      name:
                        type: string
                        description: oAuth token name
                      id:
                        type: string
                        description: oAuth token identifier
                      expires_at:
                        type: number
                        description: expiration date-time timestamp
                      details:
                        type: object
                        properties:
                          app_id:
                            type: string
                            description: Identifier of approval between user, applicant user and client that was used to issue access token
                          applicant_user_id:
                            type: string
                            description: Identifier of user that initiated access token generation
                          applicant_person_id:
                            type: string
                            description: Identifier of person that is accosiated with user who initiated access token generation
                          scope:
                            type: string
                            description: List of scopes that is required in application business logic, separated by space
                          refresh_token:
                            type: string
                            description: oAuth refresh token
                          redirect_uri:
                            type: string
                            description: Redirect URI
                          grant_type:
                            type: string
                          client_id:
                            type: string
                            description: Client ID of authorized user.
                        required:
                          - scope
                          - refresh_token
                          - redirect_uri
                          - client_id
                    required:
                      - value
                      - user_id
                      - user
                      - name
                      - id
                      - expires_at
                      - details
                    additionalProperties: false
                  paging:
                    type: object
                    properties:
                      limit:
                        type: number
                        description: 'A limit on the number of objects to be returned, between 1 and 100. Default: 50.'
                      cursors:
                        type: object
                        properties:
                          starting_after:
                            type: string
                            description: A cursor for use in pagination. An object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with `obj_foo`, your subsequent call can include `starting_after=obj_foo` in order to fetch the next page of the list.
                          ending_before:
                            type: string
                            description: A cursor for use in pagination. An object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, starting with `obj_bar`, your subsequent call can include `ending_before=obj_bar` in order to fetch the previous page of the list.
                      size:
                        type: number
                        description: Total number of objects in collection.
                      has_more:
                        type: boolean
                        description: Is this collection have more data to load in the same style as last request loaded it.
                    required:
                      - limit
                      - cursors
                      - size
                      - has_more
                    additionalProperties: false
                  urgent:
                    type: object
                    properties:
                      next_step:
                        type: string
                        enum:
                          - REQUEST_FACTOR
                          - REQUEST_OTP
                          - REQUEST_APPS
                          - RESEND_OTP
                        description: Next step of authorization process.
                    required:
                      - next_step
                required:
                  - urgent
              example:
                meta:
                  code: 201
                  url: https://example.com/resource
                  type: object
                  request_id: 6617aeec-15e2-4d6f-b9bd-53559c358f97#17810
                data:
                  value: SnNRdCtvU0tTOENBV2dLRUZwNmIzZz09
                  user_id: 3ff33ced-69dc-415a-b231-c6446898335a
                  user:
                    person_id: 2b5e9656-8750-49b3-8c5c-b9c344f8fe52
                  name: access_token
                  id: 3ff33ced-69dc-415a-b231-c6446898335a
                  expires_at: 1498749591
                  details:
                    app_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    applicant_user_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    applicant_person_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    scope: capitation_contracts:view capitation_contracts:create patients:view patients:create
                    refresh_token: my-oauth-refresh-token
                    redirect_uri: https://example.com/
                    grant_type: authorization_code
                    client_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                paging:
                  limit: 20
                  cursors:
                    starting_after: 56c31536a60ad644060041af
                    ending_before: 56c31536a60ad644060041aa
                  size: 1000
                  has_more: false
                urgent:
                  next_step: REQUEST_FACTOR
      summary: Patient login
      operationId: Patient login
      description: This endpoint should be reachable only by the eHealth authorization front-end application.
      tags:
        - Private. Patient Information System
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              token:
                client_id: 6498d88e-97fb-47e2-85a5-99e884f888aa
                grant_type: pis_auth
                signed_content: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJFSGVhbHRoIiwibm9uY2UiOiIxMjM0NSIsImV4cCI6MTUyMjM0MTExOSwiaWF0IjoxNTIyMDgxOTE5LCJpc3MiOiJFSGVhbHRoIiwianRpIjoiNWZlNzhiNzUtODQ5Zi00M2UzLTlmMzYtZWRhZWY1MmVkNzNjIiwibmJmIjoxNTIyMDgxOTE4LCJzdWIiOiIxMjM0NSIsInR5cCI6ImFjY2VzcyJ9.N_RALR_8QMzY637pzQfSAM57pW4IFCU3eGJeqfry34_me0gJbJRVhYx8NltSoBFkmCM3ROMpdp-ARUUWYNyfkA
                signed_content_encoding: base64
                scope: app:authorize profile:read
            schema:
              type: object
              properties:
                token:
                  type: object
                  properties:
                    client_id:
                      type: string
                      description: auth application client_id in mithril
                    grant_type:
                      type: string
                      enum:
                        - pis_auth
                      description: oAuth Grant Type.
                    signed_content:
                      type: string
                      description: encoded sign-in content.
                    signed_content_encoding:
                      type: string
                      description: signed content encoding type.
                    scope:
                      type: string
                      description: list of scopes that is required in application business logic, separated by space.
                  required:
                    - client_id
                    - grant_type
                    - signed_content
                    - signed_content_encoding
                    - scope
              required:
                - token
