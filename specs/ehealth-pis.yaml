          required: true
          schema:
            type: string
          example: Bearer eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9
        - name: api-key
          in: header
          description: e.g. uXhEczJ56adsfh3Ri9SUkc4en
