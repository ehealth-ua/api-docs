<!DOCTYPE html>
<html lang="uk">
  <head>
    <title>eHealth API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; padding: 0; }
      /* Deploy-time badge (date stamped at deploy, not in source control —
         see scripts/stamp_deploy_badge.sh). No env label: the hostname
         itself (docs./docs-demo./docs-preprod./docs-stage.) already tells
         the visitor which environment they're on, so a redundant in-page
         PROD/DEMO/... badge was dropped. */
      #deploy-badge{position:fixed;top:6px;right:10px;z-index:9999;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        font-size:11px;font-weight:600;letter-spacing:.02em;
        color:#fff;background:rgba(0,118,189,.92);padding:2px 9px;border-radius:11px;
        box-shadow:0 1px 3px rgba(0,0,0,.2);pointer-events:none;}
      #deploy-badge:empty{display:none;}
    </style>
  </head>
  <body>
    <!--
      eHealth API Reference — ONE Scalar instance served at /.
      No landing page, no environment switcher: in this repo a GIT BRANCH IS AN
      ENVIRONMENT (main=prod, preprod, demo, stage), so each branch is deployed
      to its own docs host and this page simply lists the SERVICES of that env.

      The left-panel document switcher cycles through the services (Medical
      Events, General MIS, eHealth PIS, eHealth Trusted PIS) plus the decoded
      signed-content documents. Every spec URL is RELATIVE -> deployable at any
      path on any static host (nginx, CDN, ...). The correct API `servers:` host
      is already baked into each spec per environment.

      To add/remove a service: edit SOURCES below and drop/remove the spec under
      specs/<service>.yaml. Signed-content docs live under specs/signed-payloads/.
    -->
    <div id="deploy-badge" title="Last deployed"></div>
    <div id="app"></div>

    <script src="assets/scalar.standalone.js?v=1.62.9-ehealth-custom.956f5e3b"></script>
    <script>
      // Document switcher entries, in display order. title -> left-panel label.
      const SOURCES = [
        { slug: 'medical-events',      title: 'Medical Events',                 url: 'specs/medical-events.yaml' },
        { slug: 'general-mis',         title: 'General MIS',                    url: 'specs/general-mis.yaml' },
        { slug: 'ehealth-pis',         title: 'eHealth PIS',                    url: 'specs/ehealth-pis.yaml' },
        { slug: 'ehealth-trusted-pis', title: 'eHealth Trusted PIS',            url: 'specs/ehealth-trusted-pis.yaml' },
        { slug: 'medical-events-signed',           title: 'Medical Events — Signed Content',    url: 'specs/signed-payloads/medical-events.yaml' },
        { slug: 'general-mis-signed',           title: 'General MIS — Signed Content',       url: 'specs/signed-payloads/general-mis.yaml' },
        { slug: 'ehealth-trusted-pis-signed',         title: 'eHealth Trusted PIS — Signed Content', url: 'specs/signed-payloads/ehealth-trusted-pis.yaml' },
      ];

      const sources = SOURCES.map((s, i) => ({ ...s, default: i === 0 }));

      // Stock Scalar — no theme overrides. Keep schema fields in the spec's own
      // (apiary) order rather than Scalar's alphabetical-with-required-first sort.
      Scalar.createApiReference('#app', {
        sources: sources,
        orderSchemaPropertiesBy: 'preserve',
        orderRequiredPropertiesFirst: false,
      });
    </script>
  </body>
</html>
