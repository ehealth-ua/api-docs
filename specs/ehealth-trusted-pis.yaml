      summary: Use Refresh Token for Access Token extension
      operationId: Use Refresh Token for Access Token extension
      description: 'This endpoint is used to renew access token using refresh token.


        It is available to renew access token as many time as needed during the lifetime of refresh token.'
      tags:
        - Public. Patient Information System
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              token:
                client_id: 6498d88e-97fb-47e2-85a5-99e884f888aa
                client_secret: msp-001-secret-key
                refresh_token: my-oauth-refresh-token
                grant_type: refresh_token
            schema:
              type: object
              properties:
                token:
                  type: object
                  properties:
                    client_id:
                      example: "6498d88e-97fb-47e2-85a5-99e884f888aa"
                      type: string
