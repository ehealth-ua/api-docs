# Після merge в main створює git-теги <service>/<env>/<version> для кожного
# сервісу кожного середовища (версія береться з info.version у base/). Ідемпотентно:
# вже існуючі теги пропускаються, тож зміна лише overlay/ нових тегів не дає.
name: release-tags

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create missing tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for env_name in prod preprod stage demo; do
            build/tag_releases.sh "$env_name" --push
          done
