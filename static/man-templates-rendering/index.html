<!DOCTYPE html>
<html lang="uk">
  <head>
    <title>eHealth Man Templates Rendering API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <style>body { margin: 0; padding: 0; }</style>
  </head>
  <body>
    <!--
      A STATIC spec: the Man templates rendering service has no environments, so it is NOT a base/<service>/<env>.yaml
      service of the main page. It is published once, on PROD only (build/assemble_site.sh copies static/* into the prod site),
      at /man-templates-rendering/. Same pinned Scalar bundle as the main page (../assets/). "Try it" is off: the service has no
      public host. Deep link: /man-templates-rendering/#tag/templates/POST/templates/{id}/actions/render
    -->
    <div id="app"></div>
    <script src="../assets/scalar.standalone.js?v=1.62.9-ehealth-custom.451f9950"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: 'openapi.yaml',
        hideTestRequestButton: true,
        orderSchemaPropertiesBy: 'preserve',
        orderRequiredPropertiesFirst: false,
      });
    </script>
  </body>
</html>
