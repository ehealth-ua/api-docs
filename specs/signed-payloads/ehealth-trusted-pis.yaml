            - relation_type
            - documents_relationship
          properties:
            person_id:
              type: string
              example: b075f148-7f93-4fc2-b2ec-2d81b19a9b7b
            relation_type:
              type: string
              enum:
                - PRIMARY
                - SECONDARY
            documents_relationship:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipDocument'
        preferred_way_communication:
          type: string
          enum:
            - email
            - phone
          description: the way how a patient wants to be reached
    Confidant_Person_PIS:
      type: object
      required:
        - person_id
        - relation_type
        - documents_relationship
      properties:
        person_id:
          type: string
        relation_type:
          type: string
          enum:
            - PRIMARY
            - SECONDARY
        documents_relationship:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipDocument'
    RelationshipDocument:
      type: object
      required:
        - type
        - number
      properties:
        type:
          type: string
          description: '`Dictionary DOCUMENT_RELATIONSHIP_TYPE`'
        number:
          type: string
          description: document issue number
        issued_by:
          type: string
          description: authority which issued the document
        issued_at:
          type: string
          description: the date when document was issued
    Authentication_Method_Patient_Request:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - THIRD_PERSON
            - OTP
            - OFFLINE
            - NA
        phone_number:
          type: string
          description: required for type = OTP
        value:
          type: string
          description: requered for type = THIRD_PERSON
        alias:
          type: string
          description: required it type = THIRD_PERSON,  and optional for type = OTP or OFFLINE
    Authentication_Method_PIS_Patient:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - OTP
        phone_number:
          type: string
          description: required for type = OTP
    Authentication_Method_PIS_Patient_With_Confidant:
      type: object
