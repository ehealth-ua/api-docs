# Деплой середовища на merge (push) у гілку env/<env>.
# Збірка працює вже зараз і лишає сайт як artifact; крок публікації на сервер
# позначено TODO і чекає на сервер.
#
# Деплой іде через GitHub Environment (prod, preprod, stage, demo), тому для
# кожного середовища в налаштуваннях репозиторію можна ввімкнути обов'язкове
# схвалення і обмеження гілок.
name: deploy

on:
  push:
    branches: ["env/prod", "env/preprod", "env/stage", "env/demo"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  target:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
      host: ${{ steps.resolve.outputs.host }}
    steps:
      - id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          env_name="${REF_NAME#env/}"
          case "$env_name" in
            prod)    host="docs.ehealth.gov.ua" ;;
            preprod) host="docs-preprod.ehealth.gov.ua" ;;
            stage)   host="docs-stage.ehealth.gov.ua" ;;
            demo)    host="docs-demo.ehealth.gov.ua" ;;
            *) echo "unexpected branch: $REF_NAME" >&2; exit 1 ;;
          esac
          {
            echo "env=$env_name"
            echo "host=$host"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (${{ needs.target.outputs.env }})
    needs: target
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.target.outputs.env }}
      url: https://${{ needs.target.outputs.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # час деплою сервісу береться з git-історії

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble site
        run: build/assemble_site.sh "${{ needs.target.outputs.env }}" _site

      - name: Stamp deploy badge
        run: build/stamp_deploy_badge.sh _site/index.html "${{ needs.target.outputs.env }}"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ needs.target.outputs.env }}-${{ github.sha }}
          path: _site
          retention-days: 30

      # TODO(DevOps): опублікувати ./_site на хост (Cloudflare / S3 / nginx).
      # Віддача: gzip/brotli, кеш і CORS описані в portal/nginx.conf.
      # Сервер ще не готовий.
      - name: Publish (pending server)
        run: |
          echo "Site is built and uploaded as artifact site-${{ needs.target.outputs.env }}-${{ github.sha }}."
          echo "TODO(DevOps): publish to ${{ needs.target.outputs.host }}"
          echo "::notice title=Not published::Hosting is not configured yet. Download the site artifact."
