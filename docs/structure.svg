<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="base і overlay збираються у dist для кожного середовища, dist публікується через portal">
  <style>
    :root { --bg:#ffffff; --ink:#0f1a24; --ink2:#4a5a68; --line:#c5d0da;
            --blue:#0b6bcb; --blue-bg:#e6f1fc;
            --amber:#b36b00; --amber-bg:#fdf1dc;
            --green:#12805c; --green-bg:#e2f5ed;
            --grey:#5a6b7a; --grey-bg:#eef2f5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#e6edf3; --ink2:#9fb0bf; --line:#30404e;
              --blue:#58a6ff; --blue-bg:#0f2339;
              --amber:#e3a23c; --amber-bg:#2b200d;
              --green:#3fb68b; --green-bg:#0e2a21;
              --grey:#8b9aa8; --grey-bg:#161d24; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--ink) }
    .bg   { fill:var(--bg) }
    .h    { font-size:19px; font-weight:700 }
    .t    { font-size:13px; fill:var(--ink2) }
    .m    { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; fill:var(--ink) }
    .tag  { font-size:11px; font-weight:700; letter-spacing:.12em }
    .arr  { stroke:var(--ink2); stroke-width:2; fill:none }
    .lab  { font-size:12px; fill:var(--ink2) }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="400" rx="14"/>

  <!-- base -->
  <rect x="30" y="40" width="250" height="150" rx="12" style="fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5"/>
  <text class="tag" x="50" y="68" style="fill:var(--blue)">ВХІД</text>
  <text class="h" x="50" y="92">base/</text>
  <text class="t" x="50" y="114">Специфікації OpenAPI</text>
  <text class="m" x="50" y="140">&lt;service&gt;/&lt;env&gt;.yaml</text>
  <text class="t" x="50" y="166">4 сервіси × 4 середовища</text>

  <!-- overlay -->
  <rect x="30" y="215" width="250" height="150" rx="12" style="fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5;stroke-dasharray:6 4"/>
  <text class="tag" x="50" y="243" style="fill:var(--amber)">ШАР КОНФІГУРАЦІЇ</text>
  <text class="h" x="50" y="267">overlay/</text>
  <text class="t" x="50" y="289">gov IDs, badges, description, version</text>
  <text class="m" x="50" y="315">(service, METHOD, path)</text>

  <!-- arrows to build -->
  <path class="arr" d="M282 115 C 330 115, 330 200, 372 200" marker-end="url(#ah)"/>
  <path class="arr" d="M282 290 C 330 290, 330 205, 372 205" marker-end="url(#ah)"/>

  <!-- build -->
  <circle cx="420" cy="202" r="46" style="fill:var(--grey-bg);stroke:var(--grey);stroke-width:1.5"/>
  <text class="h" x="420" y="199" text-anchor="middle" style="font-size:16px">build</text>
  <text class="lab" x="420" y="219" text-anchor="middle">base + overlay</text>

  <path class="arr" d="M468 202 L 548 202" marker-end="url(#ah)"/>

  <!-- dist -->
  <rect x="552" y="40" width="190" height="325" rx="12" style="fill:var(--green-bg);stroke:var(--green);stroke-width:1.5"/>
  <text class="h" x="572" y="92">dist/</text>
  <g>
    <rect x="572" y="134" width="150" height="38" rx="8" style="fill:var(--bg);stroke:var(--green)"/>
    <text class="m" x="587" y="158">prod/</text>
    <rect x="572" y="180" width="150" height="38" rx="8" style="fill:var(--bg);stroke:var(--green)"/>
    <text class="m" x="587" y="204">preprod/</text>
    <rect x="572" y="226" width="150" height="38" rx="8" style="fill:var(--bg);stroke:var(--green)"/>
    <text class="m" x="587" y="250">stage/</text>
    <rect x="572" y="272" width="150" height="38" rx="8" style="fill:var(--bg);stroke:var(--green)"/>
    <text class="m" x="587" y="296">demo/</text>
  </g>

  <path class="arr" d="M746 202 L 800 202" marker-end="url(#ah)"/>

  <!-- portal -->
  <rect x="804" y="130" width="130" height="144" rx="12" style="fill:var(--grey-bg);stroke:var(--grey);stroke-width:1.5"/>
  <text class="tag" x="822" y="158" style="fill:var(--grey)">САЙТ</text>
  <text class="h" x="822" y="182">portal/</text>
  <text class="t" x="822" y="204">Scalar</text>
  <text class="t" x="822" y="224">e-Ukraine</text>
  <text class="t" x="822" y="244">nginx.conf</text>
</svg>
