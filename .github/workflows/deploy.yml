# Деплой на merge (push) у main. Середовища визначаються за змінами шляхами:
#   base/<service>/<env>.yaml, dist/<env>/**  -> лише це середовище
#   portal/, build/, overlay/, static/, .github/ -> усі середовища
# (build/changed_envs.sh). Для кожного середовища: збірка, штамп часу деплою,
# публікація. Збірка працює вже зараз і лишає сайт як artifact; крок публікації
# на сервер позначено TODO і чекає на сервер.
#
# Деплой іде через GitHub Environment (prod, preprod, stage, demo).
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  target:
    name: Resolve environments
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.resolve.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          envs=$(build/changed_envs.sh --json "$BEFORE" "$AFTER")
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "Deploying: $envs"

  deploy:
    name: Deploy (${{ matrix.env }})
    needs: target
    if: needs.target.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.target.outputs.envs) }}
    concurrency:
      group: deploy-${{ matrix.env }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.env }}
      url: https://${{ matrix.env == 'prod' && 'docs' || format('docs-{0}', matrix.env) }}.ehealth.gov.ua
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # час деплою сервісу береться з git-історії

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble site
        run: build/assemble_site.sh "${{ matrix.env }}" _site

      - name: Stamp deploy badge
        run: build/stamp_deploy_badge.sh _site/index.html "${{ matrix.env }}"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.env }}-${{ github.sha }}
          path: _site
          retention-days: 30

      # TODO(DevOps): опублікувати ./_site на хост цього середовища
      # (docs[-<env>].ehealth.gov.ua; сьогодні це build/deploy_host.sh на хості).
      # Облікові дані/секрети тут не задані навмисно.
      - name: Publish (pending server)
        run: |
          echo "Site is built and uploaded as artifact site-${{ matrix.env }}-${{ github.sha }}."
          echo "TODO(DevOps): publish ${{ matrix.env }}"
          echo "::notice title=Not published::Hosting is not configured yet. Download the site artifact."
