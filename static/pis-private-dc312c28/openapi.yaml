      summary: Authorize an Approval
      operationId: Authorize an Approval
      description: |-
        This endpoint should be reachable only by the eHealth authorization front-end application.
        It will update or create Approval. It's idempotent.

        After creating Approval user should be redirected to `redirect_url` with `code` query parameter.
      tags:
        - Private. Patient Information System
      parameters:
        - name: Authorization
          in: header
          description: e.g. Bearer 432fsdfg543252345tfgdsgdft2345 - access_token with the `app:authorize` scope
          required: false
          schema:
            type: string
          example: Bearer 432fsdfg543252345tfgdsgdft2345 - access_token with the `app:authorize` scope
      requestBody:
        content:
          application/json:
            example:
              app:
                client_id: client-1380df72-275a-11e7-93ae-92361f002671
                scope: notebooks:read notebooks:create patients:read
                redirect_uri: http://example.com/my_success_login_page
            schema:
              type: object
              properties:
                app:
                  type: object
                  properties:
                    client_id:
                      type: string
                      description: ID of client that is granted with access to user's resources.
                    scope:
                      type: string
                      description: List of scopes that are granted to the client on the user's behalf.
                    redirect_uri:
                      type: string
                      description: URL of client where user will be redirected on Approval creation.
                  required:
                    - client_id
                    - scope
                    - redirect_uri
              required:
                - app
