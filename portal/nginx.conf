# nginx config for the static `portal/` deploy.
# Reference for serving: gzip the multi-MB YAML, serve it as text/yaml, cache the
# pinned assets/ immutably and the specs/ and scalar-docs/ short.

gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types        text/plain text/css application/javascript application/x-yaml text/yaml image/svg+xml application/json;

# Per-service page title for /<service>/... (path routing). The SPA also sets the
# same string client-side; this makes link previews (Confluence, Slack) match.
map $request_uri $doc_title {
    default                               "eHealth API Reference";
    ~^/medical-events([/?]|$)                "Medical Events | eHealth API";
    ~^/general-mis([/?]|$)                   "General MIS | eHealth API";
    ~^/ehealth-pis([/?]|$)                   "eHealth PIS | eHealth API";
    ~^/ehealth-trusted-pis([/?]|$)           "eHealth Trusted PIS | eHealth API";
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;   # the published site root
    index index.html;

    # Pinned, content-addressed (?v=) — safe to cache forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Specs — served as text/yaml, no-cache, CORS-open
    # (so the docs can also be embedded cross-origin).
    location /specs/ {
        types          { }
        default_type   text/yaml;
        add_header     Cache-Control               "no-cache" always;
        add_header     Access-Control-Allow-Origin "*"        always;
    }

    # Scalar-preprocessed JSON (what index.html loads) —
    # regenerated with every spec change, so the same no-cache rule.
    location /scalar-docs/ {
        add_header     Cache-Control               "no-cache" always;
        add_header     Access-Control-Allow-Origin "*"        always;
    }

    # Path routing: /<service>/... is the SPA shell with a service title.
    location ~ ^/(medical-events|general-mis|ehealth-pis|ehealth-trusted-pis)(/|$) {
        rewrite ^ /index.html break;
        sub_filter_once on;
        sub_filter '<title>eHealth API Reference</title>' '<title>$doc_title</title><meta property="og:title" content="$doc_title">';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
